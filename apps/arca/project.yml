name: ARCA
options:
  bundleIdPrefix: com.thezone.arca
  deploymentTarget:
    macOS: "15.0"
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

packages:
  ArcaVoiceKit:
    path: Packages/ArcaVoiceKit

targets:
  ARCA:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ArcaVoice
      - path: ArcaVoiceWidgets/RecordingIntents.swift
    dependencies:
      - package: ArcaVoiceKit
        product: ArcaVoiceKit
      # iOS-only companions ride inside the app bundle; macOS gets none of them.
      - target: ArcaVoiceWidgets
        embed: true
        destinationFilters: [iOS]
      - target: ArcaVoiceShare
        embed: true
        destinationFilters: [iOS]
      - target: ArcaVoiceWatch
        embed: true
        destinationFilters: [iOS]
    info:
      path: ArcaVoice/Support/Info.plist
      properties:
        CFBundleDisplayName: ARCA
        NSMicrophoneUsageDescription: ARCA records your meetings and voice notes.
        NSSpeechRecognitionUsageDescription: ARCA transcribes your recordings on-device.
        NSAudioCaptureUsageDescription: ARCA captures meeting audio from other apps so remote participants are transcribed without a bot.
        NSSupportsLiveActivities: true
        NSPhotoLibraryUsageDescription: ARCA reads the screenshot you just took to draft an action plan.
        NSCalendarsWriteOnlyAccessUsageDescription: ARCA adds events you approve from captured screens.
        NSHealthShareUsageDescription: ARCA reads your sleep, heart rate, HRV, and activity so it can tell you when you focus best and when to rest. It stays on your devices.
        NSHealthUpdateUsageDescription: ARCA saves the meals you tell it about, and the minutes you spend in a focus measurement, to Apple Health.
        CFBundleURLTypes:
          - CFBundleURLName: com.thezone.arca.voice
            CFBundleURLSchemes: [arca]
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.thezone.arca.voice.relaysync]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSMinimumSystemVersion: "15.0"
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: ARCA
        PRODUCT_BUNDLE_IDENTIFIER: com.thezone.arca.voice
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q85V836Q45
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: ArcaVoice/Support/ArcaVoice-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: ArcaVoice/Support/ArcaVoice-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: ArcaVoice/Support/ArcaVoice-iOS.entitlements

  # 베타 배포용 — 같은 코드, 무거운 표면(컨디션·스킬/상점·Slack 수집·바이탈)을 끈 판.
  # 번들ID/키체인/데이터가 본편과 분리되어 있어 한 맥에 나란히 설치할 수 있다.
  ARCA-Beta:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: ArcaVoice
      - path: ArcaVoiceWidgets/RecordingIntents.swift
    dependencies:
      - package: ArcaVoiceKit
        product: ArcaVoiceKit
    info:
      path: ArcaVoice/Support/Info-Beta.plist
      properties:
        CFBundleDisplayName: ARCA Beta
        NSMicrophoneUsageDescription: ARCA records your meetings and voice notes.
        NSSpeechRecognitionUsageDescription: ARCA transcribes your recordings on-device.
        NSAudioCaptureUsageDescription: ARCA captures meeting audio from other apps so remote participants are transcribed without a bot.
        NSCalendarsWriteOnlyAccessUsageDescription: ARCA adds events you approve from captured screens.
        CFBundleURLTypes:
          - CFBundleURLName: com.thezone.arca.beta
            CFBundleURLSchemes: [arca-beta]
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: ARCA Beta
        PRODUCT_BUNDLE_IDENTIFIER: com.thezone.arca.beta
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q85V836Q45
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: ArcaVoice/Support/ArcaVoice-macOS.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARCA_BETA"

  # 신기능 검증용 테스트 앱 — 본편과 번들ID/키체인/데이터 완전 분리.
  # 여기서 OK 받은 커밋만 본편(ARCA)으로 올린다.
  ARCA-Test:
    type: application
    supportedDestinations: [macOS]
    sources:
      - path: ArcaVoice
      - path: ArcaVoiceWidgets/RecordingIntents.swift
    dependencies:
      - package: ArcaVoiceKit
        product: ArcaVoiceKit
    info:
      path: ArcaVoice/Support/Info-Test.plist
      properties:
        CFBundleDisplayName: ARCA Test
        NSMicrophoneUsageDescription: ARCA records your meetings and voice notes.
        NSSpeechRecognitionUsageDescription: ARCA transcribes your recordings on-device.
        NSAudioCaptureUsageDescription: ARCA captures meeting audio from other apps so remote participants are transcribed without a bot.
        NSPhotoLibraryUsageDescription: ARCA reads the screenshot you just took to draft an action plan.
        NSCalendarsWriteOnlyAccessUsageDescription: ARCA adds events you approve from captured screens.
        CFBundleURLTypes:
          - CFBundleURLName: com.thezone.arca.voice.test
            CFBundleURLSchemes: [arca-test]
        LSMinimumSystemVersion: "15.0"
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: ARCA Test
        PRODUCT_BUNDLE_IDENTIFIER: com.thezone.arca.voice.test
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q85V836Q45
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ARCA_TEST_BUILD"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: ArcaVoice/Support/ArcaVoice-macOS.entitlements

  # ARCA↔ARCA 통화 품질 측정용 독립 앱. 본편과 완전 분리 — 통화 품질은 실제
  # 전파 위에서 두 대로 며칠 재봐야 알 수 있고, 그게 본편 릴리스 상태에 묶여선
  # 안 된다. 미디어 스택 전체는 ArcaVoiceKit의 Calling 모듈에 있으므로, 숫자가
  # 납득되면 화면만 본편으로 옮기면 된다. docs/calling.md 참고.
  ARCA-CallLab:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: CallLab
    dependencies:
      - package: ArcaVoiceKit
        product: ArcaVoiceKit
    info:
      path: CallLab/Support/Info.plist
      properties:
        CFBundleDisplayName: CallLab
        NSMicrophoneUsageDescription: CallLab places test calls, so it needs the microphone.
        # 통화 중 화면을 내려도 오디오가 끊기지 않아야 한다.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSMinimumSystemVersion: "15.0"
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: CallLab
        PRODUCT_BUNDLE_IDENTIFIER: com.thezone.arca.calllab
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q85V836Q45
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: CallLab/Support/CallLab-macOS.entitlements

  ArcaVoiceWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ArcaVoiceWidgets
    dependencies:
      - package: ArcaVoiceKit
        product: ArcaVoiceKit
    info:
      path: ArcaVoiceWidgets/Info.plist
      properties:
        CFBundleDisplayName: ARCA
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.thezone.arca.voice.widgets
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q85V836Q45
        GENERATE_INFOPLIST_FILE: false
        # Its own file, not the app's — the widget shares the App Group but must
        # not inherit the app's HealthKit capability it has no use for.
        CODE_SIGN_ENTITLEMENTS: ArcaVoiceWidgets/ArcaVoiceWidgets.entitlements

  ArcaVoiceShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ArcaVoiceShare
    dependencies:
      - package: ArcaVoiceKit
        product: ArcaVoiceKit
    info:
      path: ArcaVoiceShare/Info.plist
      properties:
        CFBundleDisplayName: Share to ARCA
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ArcaVoiceShare.ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 4
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.thezone.arca.voice.share
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q85V836Q45
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: ArcaVoiceShare/ArcaVoiceShare.entitlements

  ArcaVoiceWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: ArcaVoiceWatch
    info:
      path: ArcaVoiceWatch/Support/Info.plist
      properties:
        CFBundleDisplayName: ARCA
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.thezone.arca.voice
        NSMicrophoneUsageDescription: ARCA records voice notes from your wrist.
        NSHealthShareUsageDescription: ARCA reads your heart rate while you measure a focus session, so it can tell you how deep you actually got.
        NSHealthUpdateUsageDescription: ARCA saves each focus measurement to Apple Health as mindful minutes.
        # Lets the deep-measure session keep collecting heart rate with the wrist
        # down. Only active while a measurement the user started is running.
        WKBackgroundModes: [workout-processing]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: ARCA
        PRODUCT_BUNDLE_IDENTIFIER: com.thezone.arca.voice.watchkitapp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q85V836Q45
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ArcaVoiceWatch/ArcaVoiceWatch.entitlements
