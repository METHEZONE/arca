<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--ink);font-family:Pretendard,"Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;letter-spacing:-0.025em;-webkit-font-smoothing:antialiased;overflow:hidden}

section.s.lt .pill.o{background:var(--o);border-color:var(--o);color:#fff}
section.s.lt .pill.w{background:var(--ink);color:#fff;border-color:var(--ink)}

section.s.lt .foot{color:var(--dim)}

section.s.lt .abtn.o{background:var(--o);border-color:var(--o);color:#fff}
section.s.lt .idx a{color:var(--ink)}
section.s.lt .idx a:hover{background:var(--chip);color:var(--o)}
section.s.lt .stamp{filter:none}
section.s.lt#m8 .tbl td.X{color:#9b9088}
section.s.lt#m8 .tbl td.T{color:#8a7765}
section.s.lt .lbl.t{color:var(--dim);border-color:var(--line3)}
section.s.lt#m11 .dc .stamp{color:#9a6400;border-color:#9a6400}
section.s.lt#m11 .dc .stamp.g{color:#12803f;border-color:#12803f}
section.s.lt#m11 .dc .stamp.gr{color:#6b625c;border-color:#6b625c}
section.s.lt .g{color:#12803f}
section.s.lt .amb{color:#9a6400}
section.s.lt#m7 .gg.up .bar i{background:#12803f}
section.s.lt#m4 .t{color:#cfe3d2}
section.s.lt .qcard,section.s.lt .card{box-shadow:0 20px 50px rgba(60,40,30,.10)}
section.s.lt#m10 .bar .k{color:var(--od)}

section.s.lt .srcstrip a{color:var(--dim);border-bottom-color:var(--line2)}
section.s.lt .reveal-hint{color:var(--mut)}
section.s.lt .qcat{color:var(--mut)}
section.s.lt .layer{border-top-color:var(--line2)}

section.s.lt .abtn{font-weight:800}

/* ---------- motion library: elements sit in FINAL state; animations only when active ---------- */
section.s.active .an{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
section.s.active .an.fi{animation-name:fadeIn}
section.s.active .an.l{animation-name:slideL}
section.s.active .an.r{animation-name:slideR}
section.s.active .an.pop{animation-name:pop}
section.s.active .an.snap{animation-name:snap;animation-duration:.6s}
section.s.active .an.blur{animation-name:blurIn;animation-duration:1s}
section.s.active .gx{animation:growX 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s);transform-origin:left}
section.s.active .gy{animation:growY 1s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s);transform-origin:bottom}
section.s.active .draw{stroke-dasharray:var(--len,2000);stroke-dashoffset:var(--len,2000);animation:draw var(--dur,1.6s) cubic-bezier(.4,0,.2,1) forwards;animation-delay:var(--d,0s)}
section.s.active .lit{animation:lit .5s ease both;animation-delay:var(--d,0s)}
section.s.active .pulse{animation:pulse 1.4s ease-in-out infinite;animation-delay:var(--d,0s)}
section.s.active .type{animation:typing 1.8s steps(40) both;animation-delay:var(--d,0s);white-space:nowrap;overflow:hidden;display:inline-block;vertical-align:bottom}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideL{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes snap{0%{opacity:0;transform:scale(1.12);filter:blur(10px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes blurIn{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:blur(0)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes lit{from{opacity:.18;filter:saturate(0)}to{opacity:1;filter:none}}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 rgba(247,91,43,0));transform:scale(1)}50%{filter:drop-shadow(0 0 18px rgba(247,91,43,.9));transform:scale(1.04)}}
@keyframes typing{from{width:0}to{width:100%}}
@keyframes breathe{0%,100%{opacity:.18}50%{opacity:.55}}
@keyframes glowPulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flyIn{0%{opacity:0;transform:translate(var(--fx,-200px),var(--fy,-120px)) scale(.6)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes lockIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes inkSpread{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
@keyframes flow{to{stroke-dashoffset:-60}}
@keyframes travel{0%{offset-distance:0%;opacity:0}8%{opacity:1}100%{offset-distance:100%;opacity:1}}
@keyframes stamp{0%{opacity:0;transform:rotate(-14deg) scale(1.6)}60%{opacity:1;transform:rotate(-8deg) scale(.96)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-2px)}}
@keyframes spawn{0%{opacity:0;transform:scale(.7) translateY(20px)}100%{opacity:1;transform:none}}
@keyframes blinkc{50%{opacity:0}}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
/* ---------- HUD ---------- */
#prog{position:fixed;left:0;top:0;height:3px;background:var(--o);width:0;transition:width .4s ease;z-index:20}
#hud{position:fixed;right:18px;bottom:14px;font-size:12px;color:var(--dim2);z-index:20;font-variant-numeric:tabular-nums;display:flex;gap:14px;align-items:center;font-family:Pretendard,sans-serif;letter-spacing:0}
#hud .k{color:var(--line2)}
#hint{position:fixed;left:18px;bottom:14px;font-size:12px;color:var(--line2);z-index:20;letter-spacing:0}
#timer{display:none}
body.timing #timer{display:inline}
#timer.over{color:var(--o);font-weight:700}
#notes{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:rgba(10,8,7,.96);border-top:1px solid var(--o);color:var(--t1);padding:18px 28px;font-size:16px;line-height:1.5;display:none;z-index:30;letter-spacing:-0.01em}
#notes b{color:var(--o)}
#notes .fu{margin-top:10px;color:var(--amb)}
#notes .safe{margin-top:6px;color:var(--mut)}
body.notes #notes{display:block}
#rotate{display:none;position:fixed;inset:0;background:#000;color:var(--cream);z-index:50;align-items:center;justify-content:center;text-align:center;padding:40px;font-size:18px;line-height:1.5}
#rotate b{color:var(--o)}
@media (orientation:portrait) and (max-width:820px){#rotate{display:flex}}
#rotate.off{display:none!important}
#jump{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--bg);border:2px solid var(--o);color:var(--cream);font-size:64px;font-weight:800;padding:20px 40px;border-radius:12px;display:none;z-index:40;letter-spacing:-0.03em}
#jump small{display:block;font-size:14px;color:var(--mut);font-weight:600;margin-top:6px;letter-spacing:0}
body.jumping #jump{display:block}
/* print / static */
body.print{overflow:auto;background:#000}
body.print #stage{position:static;display:block}
body.print #deck{transform:none!important;width:var(--w);height:auto}
body.print section.s{position:relative;opacity:1;visibility:visible;margin:0 0 6px;page-break-after:always;break-after:page}
body.print section.s *{animation:none!important;transition:none!important;stroke-dashoffset:0!important;opacity:1}
body.print #prog,body.print #hud,body.print #hint,body.print #rotate,body.print #notes{display:none!important}
body.print .step{display:block!important}
@page{size:1920px 1080px;margin:0}
@media (prefers-reduced-motion:reduce){section.s.active *{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
/* steps (multi-stage slides): .step hidden until the slide's step index >= data-step */
.step{display:none}
section.s .step.on{display:block}
.stepdots{position:absolute;right:120px;top:96px;display:flex;gap:8px}
.stepdots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.stepdots i.on{background:var(--o)}
/* appendix chrome */
.appx .abar{position:absolute;left:120px;right:120px;top:40px;display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--dim)}
.abar .btns{display:flex;gap:10px}
.abtn{font-size:15px;font-weight:700;color:var(--cream);background:var(--chip);border:1px solid var(--line2);padding:9px 16px;border-radius:10px;cursor:pointer;text-decoration:none;letter-spacing:-0.01em}
.abtn:hover{border-color:var(--o);color:var(--o)}
.abtn.o{background:var(--o);border-color:var(--o);color:#fff}
.appx .qid{font-size:20px;font-weight:800;color:var(--o)}
.appx .qcat{font-size:16px;font-weight:700;color:var(--dim);letter-spacing:.02em;text-transform:uppercase}

<div id="stage"><div id="deck">
