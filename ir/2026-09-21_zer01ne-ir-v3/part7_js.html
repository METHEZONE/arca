  const ex=[["hai","생성형 AI 3년 만에 53% 사용 · 조직 88% 도입 — 발표 전 원문 재대조"],["oaiad","6개월 뒤 하루 메시지 +50% · 일 종류 2배"],["kaist","금융 전문가 34명 · AI 유발 작업 전환이 성과 저하의 가장 강한 예측 변수 (초기 연구)"],["wb","2025 global labor force 3,734,006,209"],["bls","US civilian labor force 171.495M (Dec 2025)"],["kr","취업자 29.154M (2025.09)"],["oai","whisper-1 $0.006/분 · gpt-4o-mini-transcribe $0.003/분"],["plaud","Plaud: 1M → $100M ARR (company-reported)"],["plaudtc","Plaud >2M notetakers · $100M ARR 보강"],["otter","Otter $100M ARR (company-reported)"],["granola","Granola $125M @ $1.5B"],["tomo","Tomo $5M seed"],["vellum","Vellum $20M Series A"],["instinct","Instinct official positioning"]];
  document.getElementById('a2grid').innerHTML=ex.map(([k,t],i)=>{const [n,u]=SRC[k];return `<div class="an" style="--d:${.05+i*.05}s;border-top:1px solid var(--line);padding:12px 0"><div style="color:var(--t1)">${t}</div><a href="${u}" target="_blank" rel="noopener" style="color:var(--dim);font-size:15px;text-decoration:none;border-bottom:1px solid #3a302a;word-break:break-all">${u.replace(/^https?:\/\//,'')}</a></div>`}).join('')+`<div class="an" style="--d:.8s;border-top:1px solid var(--line);padding:12px 0;grid-column:1/-1"><div style="color:var(--t1)">내부 클레임 상태: <span class="lbl m">measured</span>도그푸딩 로그 · κ-bench v0.3 방법론 · Google 로그인/전사/요약(CURRENT) &nbsp; <span class="lbl p">proxy</span>Instinct 14일 &nbsp; <span class="lbl a">assumption</span>fit 20/15% · 환율 · 계획가 &nbsp; <span class="lbl t">확인 필요</span>CherieXX 서명·입금 · 40명 인터뷰 표 · a16z/YC 원문 · 현대 1억 조건 · 12개월 가정표</div></div>`;
  // main-deck computed values
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set('tamv','≈ '+fmtKRW(F.tam)); document.getElementById('tamv').insertAdjacentHTML('beforeend','<span style="font-size:16px;font-weight:700;color:var(--mut)"> /년</span>');
  set('samv','≈ '+fmtKRW(F.sam)); set('l100',fmtKRW(100*F.annual).replace('원','')); set('l1k',fmtKRW(1000*F.annual).replace('원','')); set('l10k',fmtKRW(10000*F.annual).replace('원',''));
  set('pctv',fmtPct(F.pct10k)); document.getElementById('pctv').dataset.count=(F.pct10k*100).toFixed(3); set('f1',fmtInt(F.tam)+'원 ≈ '+fmtKRW(F.tam)); set('f2',fmtInt(F.sam)+'원 ≈ '+fmtKRW(F.sam)); set('f3',fmtPct(F.pct10k,4));
})();

/* ====================== ENGINE ====================== */
(function(){
  const slides=[...document.querySelectorAll('section.s')];
  const main=slides.filter(s=>s.classList.contains('main'));
  const deck=document.getElementById('deck'), prog=document.getElementById('prog'), nav=document.getElementById('nav'), ttl=document.getElementById('ttl'), tgt=document.getElementById('tgt'), timerEl=document.getElementById('timer'), notesEl=document.getElementById('notes');
  const idOf=s=>s.id, byId=id=>slides.findIndex(s=>s.id===id);
  const cum=[];main.reduce((a,s,k)=>{cum[k]=a+(+s.dataset.t||0);return cum[k]},0);
  const fmt=(v,dec)=>dec?Number(v).toLocaleString(undefined,{minimumFractionDigits:dec,maximumFractionDigits:dec}):Math.round(v).toLocaleString();
  const isPrint=location.search.includes('print');
  let i=0, step=0, hist=[], jumpBuf='', jumpT=null, t0=null, tickT=null;

  function resolveHash(){
    let h=decodeURIComponent(location.hash.slice(1)).toLowerCase();
    if(!h) return 'm1';
    if(h==='index'||h==='appendix'||h==='x0') return 'x0';
    if(/^\d+$/.test(h)) return 'm'+Math.max(1,Math.min(main.length,+h));
    if(/^b\d{1,2}$/.test(h)) return 'b'+(+h.slice(1));
    if(/^a\d$/.test(h)) return h;
    if(/^m\d{1,2}b?$/.test(h)) return h;
    return 'm1';
  }
  function fit(){const sc=Math.min(innerWidth/1920,innerHeight/1080);deck.style.transform=`scale(${sc})`}
  function count(el){const to=+el.dataset.count,dec=+el.dataset.dec||0,suf=el.dataset.suffix||'',dur=+el.dataset.dur||1400;const host=el.closest('.an')||el;const dl=(parseFloat((host.style.getPropertyValue('--d')||'0'))||0)*1000;const run=()=>{const s0=performance.now();(function f(t){const p=Math.min(1,(t-s0)/dur);el.textContent=fmt(to*(1-Math.pow(1-p,3)),dec)+suf;if(p<1)requestAnimationFrame(f)})(s0)};el.textContent=fmt(0,dec)+suf;setTimeout(run,dl)}
  function applySteps(s){
    const n=+s.dataset.steps||1;
    s.querySelectorAll('.step').forEach(el=>{const st=+el.dataset.step;const only=el.dataset.only!=null;const until=el.dataset.until!=null?+el.dataset.until:Infinity;const on= only? step===st : (step>=st && step<=until);el.classList.toggle('on',on)});
    s.querySelectorAll('.step.on [data-count]').forEach(el=>{if(el.dataset.counted===String(step))return;el.dataset.counted=String(step);count(el)});
    const dots=s.querySelector('.stepdots');if(dots){[...dots.children].forEach((d,k)=>d.classList.toggle('on',k<=step))}
    // S5 KPI highlight per hold frame
    if(s.id==='m6'){const map={0:['k1'],1:['k1'],2:['k2'],3:['k3','k4','k5'],4:[],5:['k3']};['k1','k2','k3','k4','k5'].forEach(k=>document.getElementById(k).classList.toggle('hot',(map[step]||[]).includes(k)))}
    if(s.id==='m17'){s.querySelector('.foot').style.display= step===1?'none':''; s.querySelector('.stepdots').style.display= step===1?'none':''}
  }
  function layers(s){return [...s.querySelectorAll('.layer')]}
  function show(n,opts={}){
    const prev=slides[i];
    if(prev&&prev!==slides[n]&&!opts.noHist){hist.push(prev.id);if(hist.length>40)hist.shift()}
    i=n;step=opts.step||0;
    slides.forEach((s,k)=>{if(k===n){s.classList.remove('active');void s.offsetWidth;s.classList.add('active')}else s.classList.remove('active')});
    const s=slides[n];
    applySteps(s);
    if(s.classList.contains('appx')){layers(s).forEach(l=>l.classList.add('hidden'))}
    history.replaceState(null,'','#'+(s.id==='x0'?'index':s.id));
    const mi=main.indexOf(s);
    if(mi>=0){prog.style.width=((mi+1)/main.length*100)+'%';nav.textContent=`${mi+1} / ${main.length}`;tgt.textContent=`목표 ${s.dataset.t}s · 누적 ${fmtT(cum[mi])}`}
    else{prog.style.width='100%';nav.textContent=s.id==='x0'?'Appendix':s.id.toUpperCase();tgt.textContent='Q&A'}
    ttl.textContent=s.dataset.title||'';
    s.querySelectorAll('[data-count]').forEach(count);
    renderNotes(s);
  }
  function fmtT(sec){const m=Math.floor(sec/60),s2=Math.round(sec%60);return `${m}:${String(s2).padStart(2,'0')}`}
  let cutMode=true;
  function renderNotes(s){const n=s.querySelector('.notes');if(!n){notesEl.innerHTML='';return}const raw=n.innerHTML;const [spoken,bd,safe]=raw.split('|');
    const plain=(spoken||'').replace(/<cut>[\s\S]*?<\/cut>/g,cutMode?'':'$&').replace(/<[^>]+>/g,'').replace(/\[→\]/g,'').replace(/\s+/g,'');const est=Math.round(plain.length/5.5);
    const spokenHtml=(spoken||'').replace(/<cut>/g,cutMode?'<span class="cutx" style="display:none">':'<span class="cutx" style="color:#5a4d44;text-decoration:line-through">').replace(/<\/cut>/g,'</span>');
    let html=`<b>${s.dataset.title||''}</b>`;if(s.dataset.t)html+=` <span class="dim">· 목표 ${s.dataset.t}s · 발화 예상 ~${est}s (${plain.length}자 @330자/분) · ${cutMode?'9:25 컷 스크립트':'전체 스크립트'} (C 전환)</span>`;html+=`<div style="margin-top:6px">${spokenHtml}</div>`;if(bd)html+=`<div class="fu">${bd}</div>`;if(safe)html+=`<div class="safe">${safe}</div>`;notesEl.innerHTML=html}
  function next(){
    const s=slides[i];
    if(s.classList.contains('appx')){
      const hidden=layers(s).filter(l=>l.classList.contains('hidden'));
      if(hidden.length){const l=hidden[0];l.classList.remove('hidden');l.classList.add('an');l.style.setProperty('--d','0s');l.querySelectorAll('[data-count]').forEach(count);return}
      if(s.id==='x0'){show(byId('b1'));return}
      if(s.id==='a3'){show(byId('x0'));return}
      show(i+1);return;
    }
    const n=+s.dataset.steps||1;
    if(step<n-1){step++;applySteps(s);return}
    const mi=main.indexOf(s);
    if(mi<main.length-1){show(i+1)} else {flashHint('본편 끝 · A 키 = Appendix (자동 진입 안 함)')}
  }
  function prev(){
    const s=slides[i];
    if(!s.classList.contains('appx')&&step>0){step--;applySteps(s);return}
    if(s.id==='x0'){show(byId('m17'),{step:1});return}
    if(s.id==='b1'){show(byId('x0'));return}
    if(i>0)show(i-1);
  }
  function back(){const id=hist.pop();if(id!=null){show(byId(id),{noHist:true})}else show(byId('x0'))}
  function flashHint(t){const h=document.getElementById('hint');const old=h.textContent;h.textContent=t;h.style.color='#f75b2b';setTimeout(()=>{h.textContent=old;h.style.color=''},2200)}
  function go(id){const k=byId(id);if(k>=0)show(k)}
  // jump buffer (digits → Bxx)
  function jumpKey(d){jumpBuf=(jumpBuf+d).slice(-2);document.body.classList.add('jumping');document.getElementById('jumpv').textContent='B'+jumpBuf.padStart(2,'_');clearTimeout(jumpT);if(jumpBuf.length===2){jumpT=setTimeout(doJump,650)}else jumpT=setTimeout(cancelJump,3000)}
  function doJump(){const n=+jumpBuf;cancelJump();if(n>=1&&n<=25)go('b'+n);else flashHint('B01–B25만 가능')}
  function cancelJump(){jumpBuf='';document.body.classList.remove('jumping');clearTimeout(jumpT)}
  // timer
  function toggleTimer(){if(t0){t0=null;clearInterval(tickT);document.body.classList.remove('timing');return}t0=performance.now();document.body.classList.add('timing');tickT=setInterval(tick,500)}
  function tick(){const el=(performance.now()-t0)/1000;const mi=main.indexOf(slides[i]);const target=mi>=0?cum[mi]:cum[main.length-1];timerEl.textContent=` ⏱ ${fmtT(el)} / ${fmtT(target)}`;timerEl.classList.toggle('over',mi>=0&&el>target)}
  // autoplay (rehearsal): advance per data-t; never enters appendix
  function autoplay(){let k=0;const run=()=>{const s=main[k];if(!s)return;show(byId(s.id));const n=+s.dataset.steps||1;const per=(+s.dataset.t*1000)/n;let st=0;const iv=setInterval(()=>{st++;if(st<n){step=st;applySteps(s)}else{clearInterval(iv);k++;if(k<main.length)run()}},per)};run()}

  if(isPrint){document.body.classList.add('print');slides.forEach(s=>{s.classList.add('active');const pr=s.dataset.print;s.querySelectorAll('.step').forEach(el=>{const st=+el.dataset.step;el.classList.toggle('on', pr? pr.split(',').includes(String(st)) : (el.dataset.only==null||st===0))});s.querySelectorAll('.layer').forEach(l=>l.classList.remove('hidden'));s.querySelectorAll('[data-count]').forEach(e=>e.textContent=fmt(+e.dataset.count,+e.dataset.dec||0)+(e.dataset.suffix||''));if(s.id==='m6'){['k1','k2','k3'].forEach(k=>document.getElementById(k).classList.add('hot'))}});return}
  addEventListener('resize',fit);fit();
  show(byId(resolveHash()),{noHist:true});
  addEventListener('hashchange',()=>{const id=resolveHash();if(slides[i].id!==id&&!(id==='x0'&&slides[i].id==='x0'))show(byId(id))});
  addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(/^[0-9]$/.test(e.key)){e.preventDefault();jumpKey(e.key);return}
    if(e.key==='Enter'&&jumpBuf){e.preventDefault();doJump();return}
    if(e.key==='Escape'){if(jumpBuf){cancelJump();return}if(slides[i].classList.contains('appx')){go('x0')}return}
    if(['ArrowRight',' ','PageDown','Enter','ArrowDown'].includes(e.key)){e.preventDefault();next()}
    else if(['ArrowLeft','PageUp','Backspace','ArrowUp'].includes(e.key)){e.preventDefault();prev()}
    else if(e.key==='Home')go('m1');else if(e.key==='End')go('m17');
    else if(e.key==='a'||e.key==='A')go('x0');
    else if(e.key==='n'||e.key==='N')document.body.classList.toggle('notes');
    else if(e.key==='t'||e.key==='T')toggleTimer();
    else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
    else if(e.key==='r'||e.key==='R')show(i,{noHist:true,step});
    else if(e.key==='b'||e.key==='B')back();
    else if(e.key==='c'||e.key==='C'){cutMode=!cutMode;renderNotes(slides[i])}
    else if(e.key==='p'||e.key==='P'){location.search='?print=1'}
  });
  addEventListener('click',e=>{
    const a=e.target.closest('a');
    if(a){const href=a.getAttribute('href')||'';if(a.classList.contains('back')){e.preventDefault();back();return}if(href.startsWith('#')){e.preventDefault();const id=href.slice(1)==='index'?'x0':href.slice(1);go(id);return}return}
    if(e.target.closest('#notes,#hud,#rotate'))return;
    show; e.clientX>innerWidth*0.35?next():prev();
  });
  let tx=0,ty=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
  addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))dx<0?next():prev()});
  if(location.search.includes('autoplay'))autoplay();
  if(location.search.includes('notes'))document.body.classList.add('notes');
  window.__deck={show,go,next,prev,slides,main,F,get i(){return i},get step(){return step}};
})();
